# Корневая конфигурация API-шлюза к PostgreSQL.

# --- Параметры HTTP-шлюза ---
gateway:
  base_path: /api/v1              # префикс маршрутов ресурсов
  pagination:
    default_limit: 20             # limit по умолчанию
    max_limit: 100                # верхняя граница limit
  query_timeout_ms: 5000          # statement_timeout SQL, мс

# --- Авторизация (stub по заголовкам) ---
authz:
  mode: header_stub               # доверенный шлюз передаёт tenant/roles в заголовках
  tenant_header: X-Tenant-Id      # UUID тенанта
  roles_header: X-Roles           # роли через запятую
  trust_header: X-Gateway-Token   # shared-secret (= GATEWAY_TRUST_TOKEN)

# --- Ресурсы (ключ = сегмент URL) ---
resources:
  users:
    table: users                  # таблица PostgreSQL
    pk: id                        # колонка PK
    soft_delete:
      enabled: true               # мягкое удаление вместо DELETE
      field: deleted_at           # колонка метки удаления
    operations:
      list: true                  # GET коллекция
      get: true                   # GET по id
      create: true                # POST
      update: true                # PUT
      patch: true                 # PATCH
      delete: true                # DELETE
      batch_create: true          # POST /batch
      bulk_delete: true           # POST /bulk-delete
      upsert: true                # POST /upsert
      aggregate: true             # GET /aggregate
    row_filters:
      - column: tenant_id         # колонка изоляции
        from_context: tenant_id   # поле RequestContext
        required: true            # без контекста → 403
    fields:
      id:
        type: uuid                # тип значения
        read: true                # в ответах
        write: false              # клиент не пишет
        primary_key: true         # PK
        auto: true                # генерируется БД/сервером
        nullable: false           # NOT NULL
      tenant_id:
        type: uuid
        read: true
        write: false              # штамп из контекста
        required: true
        nullable: false
      email:
        type: string
        read: true
        write: true
        required: true            # обязателен при create
        nullable: false
      full_name:
        type: string
        read: true
        write: true
        required: true
        nullable: false
      status:
        type: string
        read: true
        write: true
        required: false
        nullable: false
      created_at:
        type: datetime
        read: true
        write: false
        auto: true
        nullable: false
      deleted_at:
        type: datetime
        read: true
        write: false
        nullable: true            # null = активная запись
    roles:
      admin:
        operations: [list, get, create, update, patch, delete, batch_create, bulk_delete, upsert, aggregate]  # разрешённые ops
        fields:
          read: [id, tenant_id, email, full_name, status, created_at, deleted_at]  # ACL read
          write: [email, full_name, status]                                         # ACL write
      reader:
        operations: [list, get, aggregate]
        fields:
          read: [id, tenant_id, email, full_name, status, created_at]
          write: []
    relations:
      orders:
        resource: orders          # связанный ресурс
        type: one_to_many         # кардинальность
        local: id                 # колонка в users
        foreign: user_id          # колонка в orders
    filterable: [email, full_name, status, created_at]   # filter[field][op]
    sortable: [email, full_name, status, created_at]     # sort / -field
    upsert_keys: [tenant_id, email]                      # ON CONFLICT
    aggregate:
      allowed_functions: [count]  # разрешённые агрегаты
      group_by: [status]          # допустимый GROUP BY
      sum_fields: []              # поля для sum (пусто = sum нет)

  orders:
    table: orders
    pk: id
    soft_delete:
      enabled: true
      field: deleted_at
    operations:
      list: true
      get: true
      create: true
      update: true
      patch: true
      delete: true
      batch_create: true
      bulk_delete: true
      upsert: true
      aggregate: true
    row_filters:
      - column: tenant_id
        from_context: tenant_id
        required: true
    fields:
      id:
        type: uuid
        read: true
        write: false
        primary_key: true
        auto: true
        nullable: false
      tenant_id:
        type: uuid
        read: true
        write: false
        required: true
        nullable: false
      user_id:
        type: uuid                # владелец заказа
        read: true
        write: true
        required: true
        nullable: false
      order_number:
        type: string              # номер заказа (уникален в тенанте)
        read: true
        write: true
        required: true
        nullable: false
      status:
        type: string
        read: true
        write: true
        required: false
        nullable: false
      total_amount:
        type: decimal             # сумма заказа
        read: true
        write: true
        required: false
        nullable: false
      created_at:
        type: datetime
        read: true
        write: false
        auto: true
        nullable: false
      deleted_at:
        type: datetime
        read: true
        write: false
        nullable: true
    roles:
      admin:
        operations: [list, get, create, update, patch, delete, batch_create, bulk_delete, upsert, aggregate]
        fields:
          read: [id, tenant_id, user_id, order_number, status, total_amount, created_at, deleted_at]
          write: [user_id, order_number, status, total_amount]
      reader:
        operations: [list, get, aggregate]
        fields:
          read: [id, tenant_id, user_id, order_number, status, total_amount, created_at]
          write: []
    relations:
      user:
        resource: users
        type: many_to_one
        local: user_id
        foreign: id
      items:
        resource: order_items
        type: one_to_many
        local: id
        foreign: order_id
    filterable: [user_id, order_number, status, total_amount, created_at]
    sortable: [order_number, status, total_amount, created_at]
    upsert_keys: [tenant_id, order_number]
    aggregate:
      allowed_functions: [count, sum]
      group_by: [status, user_id]
      sum_fields: [total_amount]

  order_items:
    table: order_items
    pk: id
    soft_delete:
      enabled: false              # жёсткий DELETE
      field: deleted_at           # не используется при enabled=false
    operations:
      list: true
      get: true
      create: true
      update: true
      patch: true
      delete: true
      batch_create: true
      bulk_delete: true
      upsert: true
      aggregate: true
    row_filters:
      - column: tenant_id
        from_context: tenant_id
        required: true
    fields:
      id:
        type: uuid
        read: true
        write: false
        primary_key: true
        auto: true
        nullable: false
      tenant_id:
        type: uuid
        read: true
        write: false
        required: true
        nullable: false
      order_id:
        type: uuid                # FK на orders
        read: true
        write: true
        required: true
        nullable: false
      sku:
        type: string              # артикул позиции
        read: true
        write: true
        required: true
        nullable: false
      quantity:
        type: int
        read: true
        write: true
        required: true
        nullable: false
      unit_price:
        type: decimal
        read: true
        write: true
        required: true
        nullable: false
      created_at:
        type: datetime
        read: true
        write: false
        auto: true
        nullable: false
    roles:
      admin:
        operations: [list, get, create, update, patch, delete, batch_create, bulk_delete, upsert, aggregate]
        fields:
          read: [id, tenant_id, order_id, sku, quantity, unit_price, created_at]
          write: [order_id, sku, quantity, unit_price]
      reader:
        operations: [list, get, aggregate]
        fields:
          read: [id, tenant_id, order_id, sku, quantity, unit_price, created_at]
          write: []
    relations:
      order:
        resource: orders
        type: many_to_one
        local: order_id
        foreign: id
    filterable: [order_id, sku, quantity]
    sortable: [sku, quantity, unit_price, created_at]
    upsert_keys: [tenant_id, order_id, sku]
    aggregate:
      allowed_functions: [count, sum]
      group_by: [sku, order_id]
      sum_fields: [quantity, unit_price]
