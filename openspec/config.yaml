# Конфигурация OpenSpec для pg_gateway
schema: spec-driven

context: |
  Конфигурируемый API-шлюз для PostgreSQL.
  Маршруты и схемы генерируются из YAML-конфига (config/config.yaml).
  Без ORM SQLAlchemy — asyncpg с параметризованным SQL; идентификаторы только из whitelist конфига.
  Auth cert_dn (ТУЗ): mTLS на ingress; идентичность — X-Client-Cert-DN; права — accounts.<DN>.grants; tenant_id зашит в аккаунте (ТУЗ = ровно один tenant).
  Опциональные корреляционные заголовки X-Session-Id / X-User-Id (не влияют на авторизацию).
  AuthzPort вызывается на каждой операции; cert_dn безопасен по умолчанию. Postgres RLS по tenant_id на демо-таблицах.
  OpenAPI — артефакт экспорта, а не источник истины.

rules:
  gateway-routing:
    - Генерировать маршруты FastAPI только из определений ресурсов в YAML
    - Соблюдать утверждённый контракт путей под /api/v1/{resource}
    - Держать OpenAPI как экспорт работающего приложения FastAPI (OpenAPI 3.1)
  access-control:
    - Требовать известный X-Client-Cert-DN (mTLS на ingress); без peer cert — 401
    - Права брать только из accounts.grants; tenant_id — из аккаунта (не из заголовка)
    - Вызывать AuthzPort.allow на каждой операции ресурса до ACL и данных
    - Применять флаги CRUD сущностей, права чтения/записи полей из accounts.grants
    - Применять row_filters из контекста запроса (tenant_id обязателен, если настроен required:true)
    - Устанавливать app.tenant_id для Postgres RLS; при отсутствии обязательного tenant-контекста возвращать 403
  query-engine:
    - Идентификаторы ДОЛЖНЫ браться из whitelist конфига; никогда не склеивать пользовательский ввод как SQL-идентификаторы
    - Поддерживать объявленные фильтры, сортировку, пагинацию, soft-delete, joins (глубина ≤1), агрегаты
    - Использовать транзакции для CUD / batch / upsert / bulk-delete
  errors:
    - Форма тела ошибки всегда {detail, code}
    - Отображать: not found → 404, unique violation → 409, validation → 400, timeout → 504
  versioning:
    - Версионировать API через префикс пути (/api/v1)
    - Следовать SemVer; ломающее изменение контракта → major
    - Депрекация через changelog + период перед удалением
    - Вести CHANGELOG.md и уведомлять потребителей о ломающих изменениях
