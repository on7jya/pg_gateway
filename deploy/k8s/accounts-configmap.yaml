# ConfigMap overlay: authz.mode=cert_dn + ТУЗ accounts (без tenant_id).
# Монтируйте как файл и задайте ACCOUNTS_CONFIG_PATH на этот путь.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-gateway-accounts
  labels:
    app: pg-gateway
data:
  accounts.yaml: |
    authz:
      mode: cert_dn
      client_dn_header: X-Client-Cert-DN

    resources:
      users:
        row_filters: []
      orders:
        row_filters: []
      order_items:
        row_filters: []

    accounts:
      "CN=orders-reader,OU=tuz,O=Acme,C=RU":
        grants:
          orders:
            operations: [list, get, aggregate]
            fields:
              read: [id, user_id, order_number, status, total_amount, created_at]
              write: []
          order_items:
            operations: [list, get]
            fields:
              read: [id, order_id, sku, quantity, unit_price, created_at]
              write: []
      "CN=users-admin,OU=tuz,O=Acme,C=RU":
        grants:
          users:
            operations: [list, get, create, update, patch, delete]
            fields:
              read: [id, email, full_name, status, created_at, deleted_at]
              write: [email, full_name, status]
